<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ML 專案中心｜50 Startups × Boston Housing</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,"Noto Sans TC",system-ui,sans-serif;background:#080d1b;color:#eff6ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 0,#1f2d64 0,transparent 32%),#080d1b}.hub-header{height:76px;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 5vw;border-bottom:1px solid rgba(148,163,184,.18);background:rgba(8,13,27,.8);backdrop-filter:blur(18px)}.brand{font-weight:800;font-size:1.12rem;letter-spacing:-.02em}.brand span{color:#818cf8}.header-actions{display:flex;align-items:center;gap:12px}.project-picker{display:flex;align-items:center;gap:10px;font-size:.85rem;color:#a5b4fc}.project-picker select,.field-select,.dataset-url{padding:.72rem .95rem;border:1px solid rgba(129,140,248,.55);border-radius:9px;background:#131b37;color:#f8fafc;font:inherit;font-weight:700;cursor:pointer;outline:none}.project-picker select{min-width:245px}.project-picker select:focus,.field-select:focus,.dataset-url:focus{box-shadow:0 0 0 3px rgba(129,140,248,.22)}.btn{border:1px solid rgba(129,140,248,.55);border-radius:9px;padding:.7rem .9rem;background:rgba(99,102,241,.15);color:#dbeafe;font:inherit;font-size:.84rem;font-weight:700;cursor:pointer}.btn:hover{background:rgba(99,102,241,.3)}.workspace{height:calc(100vh - 76px);padding:16px}.project-frame{width:100%;height:100%;border:1px solid rgba(148,163,184,.2);border-radius:14px;background:#0f172a;box-shadow:0 18px 60px rgba(0,0,0,.3)}.modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(2,6,23,.75);backdrop-filter:blur(7px)}.modal.open{display:flex}.lab{width:min(1080px,100%);max-height:calc(100vh - 40px);overflow:auto;border:1px solid rgba(129,140,248,.35);border-radius:16px;background:#0d1530;box-shadow:0 28px 90px rgba(0,0,0,.5)}.lab-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;padding:24px 28px;border-bottom:1px solid rgba(148,163,184,.16)}.lab-head h1{font-size:1.35rem;margin:0}.lab-head p{margin:.45rem 0 0;color:#a5b4cf;font-size:.86rem;line-height:1.5}.close{border:0;background:transparent;color:#cbd5e1;font-size:1.55rem;cursor:pointer}.lab-body{padding:24px 28px;display:grid;gap:18px}.import-row{display:grid;grid-template-columns:1fr auto auto;gap:10px}.dataset-url{width:100%;font-weight:400}.upload-label{display:inline-flex;align-items:center;cursor:pointer}.upload-label input{display:none}.panel{border:1px solid rgba(148,163,184,.18);border-radius:12px;padding:18px;background:rgba(15,23,42,.55)}.panel-title{margin:0 0 12px;font-size:.95rem}.hint{color:#a5b4cf;font-size:.78rem;line-height:1.55}.config{display:grid;grid-template-columns:260px 1fr;gap:18px}.check-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px;max-height:170px;overflow:auto;padding-right:4px}.check{display:flex;gap:7px;align-items:center;padding:7px 8px;border-radius:7px;background:rgba(255,255,255,.035);font-size:.8rem;color:#dbeafe;overflow:hidden}.check span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.results{display:none;grid-template-columns:repeat(3,1fr);gap:10px}.results.show{display:grid}.metric{padding:14px;border-radius:10px;background:rgba(99,102,241,.11);border:1px solid rgba(129,140,248,.18)}.metric span{display:block;font-size:.74rem;color:#a5b4cf}.metric strong{font-size:1.3rem;margin-top:5px;display:block}.table-wrap{overflow:auto;max-height:210px}.table{width:100%;border-collapse:collapse;font-size:.78rem}.table th,.table td{padding:8px 10px;border-bottom:1px solid rgba(148,163,184,.13);text-align:left;white-space:nowrap}.table th{position:sticky;top:0;background:#151e3b;color:#c7d2fe}.status{min-height:20px;font-size:.82rem;color:#a5b4fc}.status.error{color:#fda4af}@media(max-width:760px){.hub-header{height:auto;min-height:76px;padding:14px 5vw;align-items:flex-start;flex-direction:column;gap:10px}.header-actions{width:100%;justify-content:space-between}.project-picker{width:72%}.project-picker select{min-width:0;width:100%}.workspace{height:calc(100vh - 141px);padding:10px}.project-frame{border-radius:10px}.lab-head,.lab-body{padding:18px}.import-row,.config{grid-template-columns:1fr}.results.show{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="hub-header"><div class="brand">ML <span>Project Hub</span></div><div class="header-actions"><label class="project-picker">切換專案<select id="project-select" aria-label="選擇機器學習專案"><option value="index.html#simulator-section">50 Startups 獲利預測</option><option value="boston-housing/#simulator-section">Boston Housing CRISP-DM</option></select></label><button class="btn" id="open-lab">＋ 匯入 Dataset</button></div></header>
  <main class="workspace"><iframe id="project-frame" class="project-frame" title="機器學習專案內容" src="index.html#simulator-section"></iframe></main>
  <div class="modal" id="dataset-modal" role="dialog" aria-modal="true" aria-labelledby="lab-title"><section class="lab"><header class="lab-head"><div><h1 id="lab-title">Dataset 實驗室</h1><p>貼上公開 CSV 網址或上傳 CSV；選擇預測目標與特徵後，系統會在瀏覽器內訓練 Multiple Linear Regression。</p></div><button class="close" id="close-lab" aria-label="關閉">×</button></header><div class="lab-body">
    <div class="import-row"><input id="dataset-url" class="dataset-url" type="url" value="https://raw.githubusercontent.com/Avik-Jain/100-Days-Of-ML-Code/master/datasets/50_Startups.csv" aria-label="CSV 網址"><button class="btn" id="load-url">載入網址</button><label class="btn upload-label">上傳 CSV<input id="file-input" type="file" accept=".csv,text/csv"></label></div><div class="status" id="status">可直接載入老師提供的 50_Startups.csv 範例。</div>
    <section class="panel" id="preview-panel" hidden><h2 class="panel-title">資料預覽 <span id="dataset-summary" class="hint"></span></h2><div class="table-wrap"><table class="table"><thead id="preview-head"></thead><tbody id="preview-body"></tbody></table></div></section>
    <section class="panel" id="config-panel" hidden><h2 class="panel-title">建立迴歸模型</h2><div class="config"><div><label class="hint" for="target-select">目標欄位（Y）</label><select class="field-select" id="target-select"></select><p class="hint">文字型欄位會自動 one-hot encoding；空值列會略過。資料以 80% / 20% 切分訓練與測試。</p><button class="btn" id="train-model">訓練並評估</button></div><div><span class="hint">輸入特徵（X）</span><div class="check-grid" id="feature-checks"></div></div></div></section>
    <section class="results" id="results"><div class="metric"><span>Test R²</span><strong id="r2">—</strong></div><div class="metric"><span>Test RMSE</span><strong id="rmse">—</strong></div><div class="metric"><span>Test MAE</span><strong id="mae">—</strong></div></section>
  </div></section></div>
  <script>
    const select=document.getElementById('project-select'),frame=document.getElementById('project-frame'),modal=document.getElementById('dataset-modal'),statusEl=document.getElementById('status');let rows=[],columns=[];
    const project=new URLSearchParams(location.search).get('project');if(project==='boston'){select.value='boston-housing/#simulator-section';frame.src=select.value}select.onchange=()=>{frame.src=select.value;history.replaceState({},'',`?project=${select.value.includes('boston')?'boston':'startups'}`)};
    document.getElementById('open-lab').onclick=()=>modal.classList.add('open');document.getElementById('close-lab').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};
    function parseCSV(text){const out=[];let row=[],cell='',quote=false;for(let i=0;i<text.length;i++){const ch=text[i],next=text[i+1];if(ch==='"'&&quote&&next==='"'){cell+='"';i++}else if(ch==='"'){quote=!quote}else if(ch===','&&!quote){row.push(cell.trim());cell=''}else if((ch==='\n'||ch==='\r')&&!quote){if(ch==='\r'&&next==='\n')i++;row.push(cell.trim());if(row.some(x=>x!==''))out.push(row);row=[];cell=''}else cell+=ch}row.push(cell.trim());if(row.some(x=>x!==''))out.push(row);return out}
    function loadText(text,name){const grid=parseCSV(text);if(grid.length<3)throw Error('CSV 至少需要標題列與兩筆資料。');columns=grid[0].map((x,i)=>x||`column_${i+1}`);rows=grid.slice(1).filter(r=>r.length).map(r=>Object.fromEntries(columns.map((c,i)=>[c,(r[i]||'').trim()])));renderDataset(name)}
    function renderDataset(name){document.getElementById('preview-panel').hidden=false;document.getElementById('config-panel').hidden=false;document.getElementById('dataset-summary').textContent=`· ${name} · ${rows.length} 列 × ${columns.length} 欄`;document.getElementById('preview-head').innerHTML=`<tr>${columns.map(c=>`<th>${escape(c)}</th>`).join('')}</tr>`;document.getElementById('preview-body').innerHTML=rows.slice(0,8).map(r=>`<tr>${columns.map(c=>`<td>${escape(r[c])}</td>`).join('')}</tr>`).join('');const target=document.getElementById('target-select');target.innerHTML=columns.map(c=>`<option value="${escape(c)}" ${/profit|medv|price|target|y/i.test(c)?'selected':''}>${escape(c)}</option>`).join('');renderFeatures();target.onchange=renderFeatures;status('資料已載入。請確認目標欄位與特徵，再按「訓練並評估」。')}
    function renderFeatures(){const target=document.getElementById('target-select').value;document.getElementById('feature-checks').innerHTML=columns.filter(c=>c!==target).map(c=>`<label class="check"><input type="checkbox" value="${escape(c)}" checked><span title="${escape(c)}">${escape(c)}</span></label>`).join('')}
    function escape(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function status(text,error=false){statusEl.textContent=text;statusEl.className='status'+(error?' error':'')}
    document.getElementById('load-url').onclick=async()=>{const url=document.getElementById('dataset-url').value.trim();if(!url)return status('請先輸入 CSV 網址。',true);try{status('下載 CSV 中…');const res=await fetch(url);if(!res.ok)throw Error(`HTTP ${res.status}`);loadText(await res.text(),url.split('/').pop()||'dataset.csv')}catch(e){status(`載入失敗：${e.message}。請確認網址可公開存取並允許 CORS，或改用上傳 CSV。`,true)}};
    document.getElementById('file-input').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{loadText(await f.text(),f.name)}catch(err){status(`無法讀取檔案：${err.message}`,true)}};
    function numeric(v){const n=Number(v);return Number.isFinite(n)&&String(v).trim()!==''?n:null}function mean(a){return a.reduce((s,x)=>s+x,0)/a.length}function solve(a,b){const n=b.length,m=a.map((r,i)=>[...r,b[i]]);for(let i=0;i<n;i++){let p=i;for(let j=i+1;j<n;j++)if(Math.abs(m[j][i])>Math.abs(m[p][i]))p=j;[m[i],m[p]]=[m[p],m[i]];if(Math.abs(m[i][i])<1e-10)throw Error('特徵矩陣無法反轉；請減少高度重複的特徵。');const d=m[i][i];for(let k=i;k<=n;k++)m[i][k]/=d;for(let j=0;j<n;j++)if(j!==i){const q=m[j][i];for(let k=i;k<=n;k++)m[j][k]-=q*m[i][k]}}return m.map(r=>r[n])}
    function train(){try{const target=document.getElementById('target-select').value,features=[...document.querySelectorAll('#feature-checks input:checked')].map(x=>x.value);if(!features.length)throw Error('請至少選擇一個輸入特徵。');const usable=rows.filter(r=>numeric(r[target])!==null);if(usable.length<8)throw Error('目標欄位至少需要 8 筆有效數值資料。');const cats={};features.forEach(f=>{const nums=usable.map(r=>numeric(r[f]));if(nums.some(x=>x===null)){cats[f]=[...new Set(usable.map(r=>r[f]).filter(Boolean))].slice(1)}});let labels=['截距'];features.forEach(f=>{if(cats[f])cats[f].forEach(v=>labels.push(`${f}=${v}`));else labels.push(f)});const matrix=usable.map(r=>{const x=[1];features.forEach(f=>{if(cats[f])cats[f].forEach(v=>x.push(r[f]===v?1:0));else x.push(numeric(r[f]))});return x}),y=usable.map(r=>numeric(r[target]));const valid=matrix.map((x,i)=>({x,y:y[i]})).filter(r=>r.x.every(Number.isFinite));if(valid.length<8)throw Error('部分特徵含有非數字或空值，清理後資料不足。');const testStart=Math.max(1,Math.floor(valid.length*.8)),trainRows=valid.slice(0,testStart),testRows=valid.slice(testStart);const p=labels.length,xtx=Array.from({length:p},()=>Array(p).fill(0)),xty=Array(p).fill(0);trainRows.forEach(({x,y})=>{for(let i=0;i<p;i++){xty[i]+=x[i]*y;for(let j=0;j<p;j++)xtx[i][j]+=x[i]*x[j]}});for(let i=1;i<p;i++)xtx[i][i]+=1e-8;const beta=solve(xtx,xty),actual=testRows.map(r=>r.y),pred=testRows.map(r=>r.x.reduce((s,x,i)=>s+x*beta[i],0));const mae=mean(actual.map((v,i)=>Math.abs(v-pred[i]))),rmse=Math.sqrt(mean(actual.map((v,i)=>(v-pred[i])**2))),center=mean(actual),r2=1-actual.reduce((s,v,i)=>s+(v-pred[i])**2,0)/actual.reduce((s,v)=>s+(v-center)**2,0);document.getElementById('r2').textContent=Number.isFinite(r2)?r2.toFixed(4):'—';document.getElementById('rmse').textContent=rmse.toFixed(4);document.getElementById('mae').textContent=mae.toFixed(4);document.getElementById('results').classList.add('show');status(`完成訓練：使用 ${trainRows.length} 筆訓練資料、${testRows.length} 筆測試資料、${labels.length-1} 個展開後特徵。`)}catch(e){status(`無法訓練模型：${e.message}`,true)}}document.getElementById('train-model').onclick=train;
  </script>
</body></html>
